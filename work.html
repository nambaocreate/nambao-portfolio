<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selected Works — Nam Bảo</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta name="description" content="Selected works by Nam Bảo: independent projects (Vore, EGG:01, RMIT25, Việt Cổ Truyện, Tad.atelier, VIBE Expo, Tuổi Hồng 28) and agency projects at Collective Design Agency.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Sarina&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/work-new.css">
  <!-- Preload ảnh hero của 2 trang case study đã launch để bấm ảnh
       lớn thì chuyển trang không bị chớp trắng (ảnh đã có sẵn
       trong cache, hero ở trang đích hiện ngay). -->
  <link rel="preload" as="image" href="/assets/case-study/egg-01/01-hero.jpg">
  <link rel="preload" as="image" href="/assets/case-study/tuoi-hong-28/01-hero.jpg">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body class="work-new-page">

  <!-- ============ Trang Work (bản chính thức từ v6) ============
       Viewer một màn hình: Independent Works / Agency Works,
       stack card cố định. Logic ở js/work-new.js, style ở
       css/work-new.css. Nav Contact trỏ về footer trang chủ. -->

  <div class="wn-track" id="wn-track">
    <div class="wn-viewer" id="wn-viewer">

      <nav class="nav wn-nav" aria-label="Main">
        <a class="nav-logo" href="/" aria-label="Nam Bảo, home">nambao</a>
        <div class="nav-menu-wrap" id="nav-menu-wrap">
          <ul class="nav-menu" id="nav-menu">
            <li><button type="button" class="nav-pill nav-pill--contact" id="nav-contact-btn" aria-expanded="false" aria-controls="contact-overlay">Contact</button></li>
            <li class="nav-menu-bar">
              <a class="nav-pill nav-pill--work" href="/work">Work</a>
              <span class="nav-menu-divider nav-menu-divider--1" aria-hidden="true"></span>
              <a class="nav-pill nav-pill--about" href="/#about">About</a>
              <span class="nav-menu-divider nav-menu-divider--2" aria-hidden="true"></span>
              <a class="nav-pill nav-pill--playground" href="/playground">Playground</a>
            </li>
          </ul>
          <button type="button" class="nav-ball" id="nav-ball" aria-label="Menu" aria-expanded="false" aria-controls="nav-menu">
            <span class="nav-ball-rot"><span class="nav-ball-star" id="nav-ball-star" aria-hidden="true"></span></span>
          </button>
        </div>
      </nav>

      <!-- Hàng trên: nút chuyển trang Independent / Agency bên trái, số thứ tự bên phải -->
      <div class="wn-top">
        <div class="wn-switch" id="wn-switch" role="group" aria-label="Chọn nhóm dự án">
          <button type="button" class="wn-switch-btn is-active" data-coll="independent" aria-pressed="true">Independent Works</button>
          <span class="wn-switch-slash" aria-hidden="true">/</span>
          <button type="button" class="wn-switch-btn" data-coll="agency" aria-pressed="false">Agency Works</button>
          <span class="wn-switch-note">(at Collective Design Agency)</span>
        </div>
        <p class="wn-count" id="wn-count" aria-live="polite">01/07</p>
      </div>

      <!-- Hàng chính: thông tin trái, ảnh lớn phải -->
      <div class="wn-main">
        <div class="wn-left">
          <div class="wn-info" id="wn-info">
            <h1 class="wn-title" id="wn-title">Vore</h1>
            <p class="wn-meta" id="wn-meta">
              <span class="wn-cat" id="wn-cat">Food &amp; beverage</span><span class="wn-dash" id="wn-dash" aria-hidden="true"></span><span class="wn-year" id="wn-year">2025</span>
            </p>
            <ul class="wn-tags" id="wn-tags"></ul>
          </div>

          <!-- Hàng dưới: tên dự án trái, thumbnail phải -->
          <div class="wn-bottom">
            <!-- Danh sách tên dự án: đang xem màu đen, còn lại xám; bấm để chuyển -->
            <ul class="wn-filters wn-names" id="wn-filters" aria-label="Danh sách dự án"></ul>
            <!-- Khung giữ chỗ: card thật nằm trong #wn-cards, JS đo các khung này -->
            <div class="wn-thumbs" id="wn-thumbs" aria-hidden="true">
              <span class="wn-slot wn-slot--back"></span>
              <span class="wn-slot wn-slot--mid"></span>
              <span class="wn-slot wn-slot--front"></span>
            </div>
          </div>
        </div>

        <!-- Khung giữ chỗ ảnh lớn (card thật nằm trong #wn-cards) -->
        <div class="wn-media" id="wn-media" aria-hidden="true"></div>
      </div>


      <!-- Lớp chứa toàn bộ card dự án (ảnh lớn, deck, thumbnail) -->
      <div class="wn-cards" id="wn-cards"></div>
    </div>
  </div>

  <!-- ============ Lightbox cũ (đã nghỉ, giữ lại cho an toàn) ============
       Từng mở khi bấm ảnh lớn Independent; từ khi có trang case study
       thì bấm ảnh lớn sẽ sang trang case study (EGG:01, Tuổi Hồng 28)
       hoặc không làm gì (dự án chưa có trang), nên không còn chỗ nào
       mở lightbox nữa. Giữ nguyên phần tử để các chỗ kiểm tra
       lightbox.hidden không vỡ; xóa hẳn sau khi kiểm tra kỹ. -->
  <div class="wn-lightbox" id="wn-lightbox" hidden>
    <figure class="wn-lightbox-frame">
      <img id="wn-lightbox-img" src="assets/work/vore.jpg" alt="">
    </figure>
    <button type="button" class="wn-lightbox-close" id="wn-lightbox-close" aria-label="Đóng">Close</button>
    <p class="wn-lightbox-cap" id="wn-lightbox-cap"></p>
  </div>

  <div class="cursor" aria-hidden="true"><span data-cursor-label="read">Read</span><span data-cursor-label="open">Open</span><span data-cursor-label="soon">coming soon</span><span data-cursor-label="newtab"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M5 21L21 5M8 5h13v13" stroke="#fff" stroke-width="2"/></svg></span></div>

  <!-- ============ CONTACT: overlay tối + card xanh lá lật mặt ============ -->
  <div class="contact-overlay" id="contact-overlay" aria-hidden="true">
    <div class="contact-card-tilt" id="contact-card-tilt">
      <div class="contact-card-flip" id="contact-card-flip">
        <article class="contact-card contact-card--front">
          <p class="contact-label">get in touch</p>
          <button type="button" class="contact-email" id="contact-email">nambao.create@gmail.com</button>
          <span class="contact-copied" id="contact-copied" role="status">✓ Đã copy</span>
          <ul class="contact-socials">
            <li><a href="https://www.instagram.com/bynambao/" target="_blank" rel="noopener" aria-label="Instagram"><img src="assets/social/instagram.svg" alt="" width="24" height="24"></a></li>
            <li><a href="https://www.facebook.com/nambao.create/" target="_blank" rel="noopener" aria-label="Facebook"><img src="assets/social/facebook.svg" alt="" width="24" height="24"></a></li>
            <li><a href="https://www.linkedin.com/in/nam-bao/" target="_blank" rel="noopener" aria-label="LinkedIn"><img src="assets/social/linkedin.svg" alt="" width="24" height="24"></a></li>
            <li><a href="https://www.behance.net/nam-bao" target="_blank" rel="noopener" aria-label="Behance"><img src="assets/social/behance.svg" alt="" width="24" height="24"></a></li>
          </ul>
          <p class="contact-logo" aria-hidden="true">nambao</p>
        </article>
        <article class="contact-card contact-card--back" aria-hidden="true">
          <p class="contact-logo" aria-hidden="true">nambao</p>
        </article>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/work-new.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
